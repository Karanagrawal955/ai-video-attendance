[project]
name = "ai-video-attendance"
version = "1.0.0"
description = "AI-based video attendance system backend (FastAPI + InsightFace + Celery + PostgreSQL)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Attendance Team" }]
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "SQLAlchemy>=2.0.35,<3.0",
    "alembic>=1.13,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "celery[redis]>=5.4,<6.0",
    "redis>=5.2,<7.0",
    "PyJWT>=2.9,<3.0",
    "python-multipart>=0.0.9,<1.0",
    "nvidia-ml-py>=12.560.30",
    "numpy>=1.26,<3.0",
    "tzdata>=2024.1",
    "insightface==2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "fakeredis>=2.26",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]
